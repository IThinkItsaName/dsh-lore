name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # node 门禁（tests/*.mjs）要从 npm 拿宿主包才 import 得动 `lib/index.js`：
      # 插件的两个 peerDependencies 在 `devDependencies` 里钉了版本，`npm ci` 就是
      # "CI 用什么版本跑门禁"的唯一答案。本机靠 `dsh-ref/source` 那棵参考树，
      # CI 没有它，走的就是这条 `node_modules` 路（`tests/_pkg.mjs` 的候选顺序）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test-only host packages
        run: npm ci

      - name: Validate package.json
        run: python -m json.tool package.json > /dev/null

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("skills/project-work-log/SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md: missing frontmatter")
          fm = m.group(1)
          name = re.search(r"^name:\s*(.+)$", fm, re.M)
          desc = re.search(r"^description:\s*(.+)$", fm, re.M)
          if not name or not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name.group(1).strip()):
              sys.exit("SKILL.md: invalid name")
          if not desc or len(desc.group(1).strip()) > 1024:
              sys.exit("SKILL.md: invalid description")
          print("SKILL.md frontmatter OK")
          PY

      # 别在步骤名里写断言条数：那个数字会过期（这里曾写死 95，后来写"实际已是 586"，
      # 一样会过期 —— 所以现在连那个数字也不写了）。
      # 要看条数就读这一步的输出最后一行。
      #
      # `-B`（不写 `.pyc`）不是洁癖：脚本就住在 `skills/` 里，Python 会把 `__pycache__`
      # 生成在**包内**，而 `_package.py --check` 把副本里的 `__pycache__` 当漂移（它会随包发出去）。
      # 于是"跑过自测"本身会把下一道门禁弄红 —— 实测踩过。`npm test` 同样带 `-B`。
      - name: Skill self-test
        run: python -B skills/project-work-log/scripts/_selftest.py

      # `dist/skill-only/` 是 `tools/build-skill-only.mjs` 的产物，但**有 3 个文件是跟踪的**
      # （SKILL.md 与两份 references）；`tests/audit-paths.mjs` 会核对它与源逐字节一致，
      # 所以这一步是**检查**而不是"建出来"——产物缺失或过期时它会报错并退出 1。
      - name: Check the skill-only copy
        run: npm run test:skill-only

      # 16 支 harness。它们各自的收尾都用 tests/_report.mjs 的 `report()`，
      # 有 FAIL 就 exit 1；有 SKIP 会在末行注明 `(N skipped)`，别把"没验"读成"验过"。
      # `tests/audit-harness-hygiene.mjs` 守着这份名单本身：磁盘上的门禁与这里列的对不上就红。
      - name: Plugin harnesses
        run: npm run test:plugin

      # 入口哈希 + 宿主注册表契约。
      - name: Registry pre-audit
        run: npm run audit
