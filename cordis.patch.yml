# worklog bundle patch — turns on the skill subsystem this bundle needs, and
# inserts this package's own host row.
#
# `dsh-base` already declares `skill`, `skill-filesystem`, and `tool-skill`, but
# ships them switched off. A patch that targets an existing row by id overrides
# it (last write wins); `insert` would append a *duplicate* row instead, so the
# first three entries below are overrides, not inserts.
#
# Rows:
#   1. `skill`            — the skill registry this plugin registers on.
#   2. `skill-filesystem` — the local skill provider. This bundle keeps its
#                           Markdown on disk (a directory bundle under
#                           `skills/project-work-log/`), and this provider is
#                           what makes such a bundle discoverable when DSH runs
#                           with that directory as its project root.
#   3. `tool-skill`       — the consumer that renders the catalog and the
#                           `skill` tool. Without it a registered skill never
#                           reaches a session.
#   4. `dsh-worklog`      — this package: registers the bundled skill with
#                           `ctx.skills`, so the skill works regardless of which
#                           directory the profile runs in.
#
# A profile's own `cordis.patch.yml` is applied after every bundle layer, so any
# of these rows can still be overridden or disabled there.
#
# Requires: dsh >= 0.1.7 (the version whose dsh-base declares these rows).

- id: skill
  name: '@deepseek-ai/dsh-skill'
  disabled: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: false

- insert:
    - id: dsh-worklog
      name: 'dsh-worklog'
      config:
        skillDir: 'skills/project-work-log'
        modelInvocable: true
        userInvocable: true
        verbose: false
