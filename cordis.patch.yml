# worklog bundle patch — enables the skill provider this bundle needs, and
# inserts this package's host row.
#
# Skills that ship with this bundle (one provider each; any further bundle placed under
# `skills/` is served too — see `apply()`):
#   - `project-work-log`       — the work-record system (journal + ledger + lessons).
#   - `reliability-guidelines` — eight working principles, applied in the projects
#                                that install this plugin. Disable with
#                                `guidelinesEnabled: false`; pick the language with
#                                `guidelinesLanguage: 'zh' | 'en'`.
#
# ── Why the override below is required ─────────────────────────────────────────
# `dsh-base` declares `skill-filesystem`; `dsh-web-app` then disables it. The
# Plugin Manager page does NOT surface that row (it is not an optional bundle),
# so a user cannot turn it on from the UI. Measured on a real profile: with that
# row off, the registry is alive and this plugin mounts and answers `list()`
# correctly, yet NO skill reaches the `skill` tool — and skill files dropped into
# `~/.dsh/skills` or `.dsh/skills` are never discovered either. A bundle that
# ships a skill therefore has to enable this row itself, by targeting the
# existing row id (an override) rather than inserting a second one.
#
# ── Deliberately NOT touched ───────────────────────────────────────────────────
# `tool-skill` (the model-facing catalog and `skill` tool) stays wherever the
# composition put it: it is the consumer, and a preset owns it. If your
# composition mounts no skill consumer at all, this bundle cannot render
# anything — check `list_plugins` for `tool-skill` before expecting the skills to
# appear in a session.
#
# Requires: dsh >= 0.1.7 (the version whose dsh-base declares these rows).

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false

- insert:
    - id: dsh-lore
      name: 'dsh-lore'
      config:
        skillDir: 'skills/project-work-log'
        modelInvocable: true
        userInvocable: true
        verbose: false
        guidelinesEnabled: true
        guidelinesDir: 'skills/reliability-guidelines'
        # 'zh' (default) or 'en'. A profile's own patch layer is applied after
        # every bundle layer, so it can override this per profile.
        guidelinesLanguage: 'zh'
